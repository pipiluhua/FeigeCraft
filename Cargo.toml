[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "1.0.2"
edition = "2021"
rust-version = "1.78"
license = "MIT"
authors = ["FeigeCraft contributors"]
repository = "https://github.com/pipiluhua/FeigeCraft"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
dirs = "5"
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }

# GUI
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
rfd = "0.15"
# 只用来解表情 PNG（Twemoji 素材），关掉默认特性避免拖进一堆编解码器
image = { version = "0.25", default-features = false, features = ["png"] }
