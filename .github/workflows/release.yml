name: release

# 打 tag（如 v1.0.0）或手动触发时，三平台构建并发布 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows（GNU 工具链，可嵌入图标与版本信息）----
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact: feigecraft.exe
            archive: feigecraft-windows-x64.zip
            setup-msys: "true"
          # ---- Linux（X11 + Wayland）----
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: feigecraft
            archive: feigecraft-linux-x64.tar.gz
            setup-msys: "false"
          # ---- macOS (Apple Silicon) ----
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: feigecraft
            archive: feigecraft-macos-arm64.tar.gz
            setup-msys: "false"
          # ---- macOS (Intel)：在 arm64 runner 上交叉编译 x86_64 ----
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: feigecraft
            archive: feigecraft-macos-x64.tar.gz
            setup-msys: "false"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows：装 mingw-w64（windres + gcc），用 GNU 工具链以便嵌入图标。
      - name: Setup MSYS2 (Windows)
        if: matrix.setup-msys == 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      # Linux：egui(glow) 需要 X11/Wayland 与键盘库；rfd 文件对话框依赖 GTK3。
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgtk-3-dev libssl-dev pkg-config \
            libwayland-dev libx11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" `
            -DestinationPath ${{ matrix.archive }}

      - name: Package (Linux/macOS tar.gz)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          chmod +x ${{ matrix.artifact }}
          tar -czf ../../../${{ matrix.archive }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # 仅打 tag 时发布；手动触发也可以。
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: false
          generate_release_notes: true
